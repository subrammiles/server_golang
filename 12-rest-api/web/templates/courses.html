<!doctype html>
<html>
<head><meta charset="utf-8"><title>{{.Title}}</title></head>
<body>
  <h1>{{.Title}}</h1>
  <table border="1" cellpadding="6">
    <tr><th>Course</th><th>Category</th><th>Hours</th><th>Price</th></tr>
    {{range .Courses}}
    <tr><td>{{.Title}}</td><td>{{.Category}}</td><td>{{.DurationHours}}</td><td>₹{{.Price}}</td></tr>
    {{else}}
    <tr><td colspan="4">No courses yet</td></tr>
    {{end}}
  </table>
  <p>JSON API: <a href="/api/courses">/api/courses</a></p>
</body>
</html>
